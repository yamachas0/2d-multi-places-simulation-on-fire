# === Phase 1 都市構造 v2 — 品川駅前モデル都市 ===
#
# 3階層 (道路 / 広場 / 施設) を日本語 place 名で再設計。
# 既存の火災シナリオ (type: disaster) をそのまま動かす検証用。
# 機能2/3/4 の Stage A スケール (30 agents × 60 steps) テストも兼ねる。

simulation:
  duration: 60
  half_space_size: 75
  half_place_size: 5
  seed: 42
  time_scale:
    step_duration_minutes: 1
    start_time: "08:00"
    patterns:
      - hours: [7, 8]
        enter_per_step: 0.25
        exit_per_step: 0.05
        neighborhood_mood: "朝のラッシュ時間帯。通勤客が駅から街に吐き出されてくる"
        default_goal: "通勤・通学中"
      - hours: [9, 10, 11]
        enter_per_step: 0.10
        exit_per_step: 0.08
        neighborhood_mood: "ラッシュが落ち着き、街に人が残り始める時間帯"
        default_goal: "朝のひと仕事・散歩・買い物"

agents:
  num_agents: 30
  max_agents: 40
  communication_radius: 10
  memory_limit: 20
  memory_size: 5
  message_history_limit: 10
  message_context_size: 3
  skip_probability: 0.2
  parallel_workers: 15
  movement_speed:
    base_cells_per_step: 8
    variance: 2

  personas:
