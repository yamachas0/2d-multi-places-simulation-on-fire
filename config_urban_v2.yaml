  provider: "google"
  model: "gemini-3.1-flash-lite-preview"
  base_url: "https://generativelanguage.googleapis.com"
  temperature: 0.2
  max_tokens: 400

# 既存の火災シナリオを保持 (type: disaster 互換)。Phase 2 でこれを
# type: transit_disruption に差し替えた新 config を別途作る。
fires:
  - name: "fire_1"
    start_step: 40
    intensity: 0.8
    radius: 25
    center_x: 25
    center_y: 30

visualization:
  save_frames: true
  frame_interval: 2
  output_dir: "_urban_v2_out"
  focus_agent_id: 4            # 佐々木和夫 (新婚、駅前広場から動く) を主役として追跡

logging:
  level: "INFO"
  log_file: "_urban_v2.log"
