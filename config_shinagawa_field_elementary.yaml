    - '[座学を経て描いた品川の未来像] ビルが立ち並ぶ未来っぽい場所と、古いお寺が混ざってるRPGみたいな街。ロボットが宿題をやってくれて、駅の混雑もスマホで全部解決する超便利な場所になってほしい。'
