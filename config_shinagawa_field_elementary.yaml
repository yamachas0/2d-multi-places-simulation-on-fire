    - '[座学で気になっていること 2] ロボットが荷物を持ってくれるのは便利だけど、動きが変だとマジでキモい。'
    - '[座学で気になっていること 3] 駅の混雑はマジでうんこレベルだから、早くスマホで解決できるようになってほしい。'
