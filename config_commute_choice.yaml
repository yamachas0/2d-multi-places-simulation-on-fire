# ================================================================
# 帰宅移動手段の選択シミュ (commute_choice)
# ================================================================
# Built by tools/build_commute_choice_config.py
#
# フィールド：[オフィス]→ 5本のレーン (鉄道/バス/タクシー/自転車/徒歩) →[自宅]
# シナリオ：18:00定時退勤 → 18:05にJR運休発生 → 各エージェントが代替手段を選ぶ
# 通勤手段比率 (本線): 電車80 / バス10 / 自転車5 / 徒歩5
#                     タクシーは平常時0、運休時の代替候補
#   - num_agents       : 100
#   - duration (steps) : 30
#   - parallel_workers : 25
# ================================================================

simulation:
  duration: 30
  half_space_size: 60
  half_place_size: 5
  seed: 42
  time_scale:
    step_duration_minutes: 1
    start_time: '18:00'
    patterns:
    - hours:
      - 18
      - 19
      enter_per_step: 0.0
      exit_per_step: 0.0
      neighborhood_mood: 退勤時間。オフィスから帰宅手段を選んで自宅へ向かう人々。JR線・バス・タクシー・自転車・徒歩の5本のレーンが並走している。
      default_goal: 退勤し、適切な手段で帰宅する
agents:
  num_agents: 100
  max_agents: 100
  communication_radius: 12
  memory_limit: 20
  memory_size: 5
  message_history_limit: 10
  message_context_size: 3
  skip_probability: 0.2
  parallel_workers: 25
  movement_speed:
    base_cells_per_step: 8
    variance: 2
  personas:
