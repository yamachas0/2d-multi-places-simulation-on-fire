    fw_task: "[今日のFW課題] FW中、必ず以下の 2 か所の企業担当者を訪ね、自社の取り組みや品川での役割について話を聞いてください。\n  ① 高梨 みどり さん (拠点: 品川水族館)\n  ② 藤本 健司 さん (拠点: 品川プリンスホテル)\n自分の関心と違う場所が指定されているように見えても、まずは行ってみる。行ってみたからこそ気づけることがある。残りの企業担当者にも余裕があれば立ち寄ってよい。"
    handoff_intent: 午後のフィールドワークでは、高輪ゲートウェイ駅周辺の再開発エリアと品川宿のあたりを歩いて、座学で話した「新旧の混在」を肌で感じてみたいです。また、アンナさんの提案を受けて、案内表示の多言語化にも注目してみます。
    handoff_future_image: 品川は、最先端の技術と歴史的な街並みが共存し、国内外から多くの人が訪れやすい、活気あふれる国際的なハブ都市になる未来像を描いています。
    handoff_key_memories:
    - 高輪ゲートウェイ駅周辺の再開発エリアと品川宿のあたりに興味がある。
    - 品川の新旧が混ざった雰囲気が面白いと感じている。
    - 駅の案内表示の多言語化に注目してみようと思う。
    initial_memory:
    - '[座学を経て描いた品川の未来像] 品川は、最先端の技術と歴史的な街並みが共存し、国内外から多くの人が訪れやすい、活気あふれる国際的なハブ都市になる未来像を描いています。'
    - '[これから現地でどう過ごしたいか] 午後のフィールドワークでは、高輪ゲートウェイ駅周辺の再開発エリアと品川宿のあたりを歩いて、座学で話した「新旧の混在」を肌で感じてみたいです。また、アンナさんの提案を受けて、案内表示の多言語化にも注目してみます。'
    - '[座学で気になっていること 1] 高輪ゲートウェイ駅周辺の再開発エリアと品川宿のあたりに興味がある。'
    - '[座学で気になっていること 2] 品川の新旧が混ざった雰囲気が面白いと感じている。'
    - '[座学で気になっていること 3] 駅の案内表示の多言語化に注目してみようと思う。'
    - '[前提] これは企業協力型の学外教育プログラムです。午前中に教室で座学を行い、昼食をはさんで、午後 13時から品川駅前に出てフィールドワークをします。FWではいくつかの企業 (水族館・プリンスホテル・京急・トヨタ・税務署・JR・NTT・ソニー・コクヨ・食肉市場・浄水場・日鉄興和不動産) が学生の受け入れ担当を配置していて、訪れれば自社の取り組みと品川の未来について語ってくれます。フィールドは品川駅周辺。100step以内に出発地である東西自由通路 (駅の東西を結ぶ歩行者デッキの中央、港南側と高輪側のどちらにも等距離) に戻ります。途中の動きはあなたの判断です。一人で動くか誰かと一緒に動くかも自分で決めて構いません。'
    - '[今日のFW課題] FW中、最低でも 2社以上の企業担当者 (受け入れ拠点) のところを実際に訪ね、自社の取り組みや品川での役割について話を聞いてください。どの企業を選ぶかは自分の興味で決めて構いませんが、必ず 2社以上に立ち寄ること。'
    - '[現在地] 東西自由通路 (駅の東西を結ぶ歩行者デッキの中央)。13時に集合してフィールドワークを始めたばかり。港南側にも高輪側にも等距離で行ける。座学で議論した知識は頭に入っているが、実際に歩いてどんな光景・動線・人の流れに出会うかは現地次第。'
