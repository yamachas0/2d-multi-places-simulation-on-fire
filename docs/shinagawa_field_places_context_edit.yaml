- name: 港南口広場
  type: plaza
  perceive_pass: |-
    アトレを抜けて港南口に出ると、北はアレア品川、南はグランドコモンズとインターシティに向かうデッキが伸びる。屋根付きでアンブレラフリー。正面に居酒屋やバー含む飲食店街がまっすぐ伸びる。
  perceive_enter: |-
    エスカレーターと階段で広場に降りられる。階段の裏側にタクシー乗り場、アレア2F脇からタクシー乗り場に直接降りれる隠れた階段がある。
  environment_hint:
    indoor: false
    roof: true
    grade: flat
- name: NTT
  type: office_lobby
  perceive_pass: |-
    古い大きなビル。1Fがオフィスロビーのみ、飲食店等はなく閉鎖的な雰囲気。
  perceive_enter: |-
    ロビーは入れるが用事がないと長居できる場所はない。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: コクヨ
  type: office_lobby
  perceive_pass: |-
    北館1Fがショールーム、入口は狭いが中はインテリアメーカーらしいおしゃれな空間。
  perceive_enter: |-
    南館は本社オフィスでライブオフィス、社員が実際に働いているのが見える、開放的でおしゃれ。コクヨより東側は大小の雑居ビル(特徴薄)。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: ソニー
  type: office_lobby
  perceive_pass: |-
    1Fオフィスロビーに過去製品が並び、椅子テーブルあり。開放的で明るい雰囲気。
  perceive_enter: |-
    誰でも入れる雰囲気で、過去のソニー製品を眺められる。タリーズあり。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: 繁華街
  type: restaurant
  perceive_pass: ''
  perceive_enter: ''
