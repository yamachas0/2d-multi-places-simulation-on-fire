- name: 品川セントラルガーデン
  type: plaza
  perceive_pass: |-
    南北に長い広場、グラコモとインターシティに挟まれた谷間のような場所。比較的開放的、デッキからも眺められる、憩える場所も点在。
  perceive_enter: |-
    ベンチや植栽がある。上空2Fレベルでグラコモとインターシティを繋ぐデッキが2本走る。南端に近づくと「品川駅前ここまで」の境界感。
  environment_hint:
    indoor: false
    roof: false
    grade: flat
    near_construction: false
    near_park: true
- name: 芝浦中央公園
  type: park
  perceive_pass: |-
    花々と芝生広場で構成された広いデッキ公園。遊具などは少なく、犬の散歩道のイメージ。
  perceive_enter: |-
    一番奥にバラ園。近い将来、JR線路を越えるデッキで高輪ゲートウェイ駅と直結する予定。
  environment_hint:
    indoor: false
    roof: false
    grade: flat
    near_park: true
