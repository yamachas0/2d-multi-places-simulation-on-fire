# ===== 品川FW 施設コンテキスト編集用 (2026-05-03 抜粋) =====
# 全 37 施設 (autoname '_xxx_' は除外、名前付きのみ抽出)
# 現状 perceive_pass あり: 21 / 全37
# 現状 perceive_enter あり: 18 / 全37
#
# 各施設に対して以下を加筆・修正してください:
#   perceive_pass : 通り過ぎたとき (= 中に入らない、外から見える光景・印象) 2-4文
#   perceive_enter: 中に入ったとき (= 内部の構造・体験・隠れた要素) 2-4文
#
# 何も書きたくない / 自明な施設は空欄のまま (空文字 '' のまま) で OK。
# environment_hint は参考情報 (indoor / roof / grade など)、編集不要。
#
# 反映: 編集後 .yaml を投げてくれれば docs/shinagawa_field_places.yaml に焼き戻し。
# ============================================================

places:
- name: 品川プリンスホテル
  type: hotel
  perceive_pass: |-
    そびえる高層ホテル、大きな荷物を持った観光客が多数行き交う。横断歩道を渡ったところからすぐ目の前。
  perceive_enter: |-
    ロビー入ると広いカフェ・レストラン、観光客で賑わう。水族館・映画館への動線もここから。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: アトレ品川
  type: restaurant
  perceive_pass: |-
    東西自由通路レベル(2F)がメイン入口。飲食・物販店舗が5階まで広がる。平面の面積は小さいが上に積層している。
  perceive_enter: |-
    中に入ると各フロアにブランドショップとレストラン、エスカレーターで階を移動。3階にブルーボトルコーヒー。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: 高輪の森公園
  type: park
  perceive_pass: |-
    工事現場、グランドプリンス高輪・新高輪に囲まれる場所。柘榴坂から細い道を進んでしか入れない、入口に気持ちばかりの広場。
  perceive_enter: |-
    大半は勾配のある森。プレーパークなどで地域の子供たちに使われる。
  environment_hint:
    indoor: false
    roof: false
    grade: steep
    near_park: true
- name: 品川水族館
  type: department_store
  perceive_pass: |-
    プリンスホテル敷地の水族館、ファミリー層と観光客のターゲット。
  perceive_enter: |-
    中は薄暗い水槽の連続、子ども連れ多い。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: ウィング高輪
  type: restaurant
  perceive_pass: |-
    京急1ビルの低層商業、地下から3階まで飲食・物販店舗が並ぶ。坂道状のカスケードを登っていくと、その先に水族館と映画館がある特徴的な構造。
  perceive_enter: |-
    中はカスケード状で歩いていて楽しい構造、観光客と地元の家族連れが混ざる。
  environment_hint:
    indoor: true
    roof: true
    grade: gentle
- name: アレア品川
  type: office_lobby
  perceive_pass: |-
    デッキレベル(2F)にドトールとオフィスロビー、1Fと吹き抜けエスカレーターでつながり、1Fには飲食店がいくつか。
  perceive_enter: |-
    1Fから外に出てまっすぐ進むとNTTビルに至るが、シーズンテラス側にはうまく抜けられない(東の道路側に抜ける必要)。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: 税務署
  type: utility
  perceive_pass: |-
    柘榴坂上側、行政機関の硬い建物。
  perceive_enter: |-
    中は典型的な行政施設、来客は限られる。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
