  perceive_enter: |-
    オフィスロビー、屋外階段でフロア間を移動できる開放感。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: JR改札
  type: subway_station
  perceive_pass: |-
    ガラスのアトリウムで明るい。小さいが目印になる時計がある。待ち合わせや行き交う人であふれている。
  perceive_enter: |-
    改札内に入るとエキナカ(飲食・物販)、各ホームへ階段とエスカレーター。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: 京急改札
  type: subway_station
  perceive_pass: |-
    青いサインなし、狭くてごちゃごちゃしている。JR改札から高輪口側に降りる工事中の無機質な階段、バリアフリーELVもある。
  perceive_enter: |-
    改札内ホームは狭く、京急本線の電車が頻繁に出入りする。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
