  perceive_enter: |-
    イベント時のみ賑わう、それ以外は静か。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: プリンスさくらタワー
  type: hotel
  perceive_pass: |-
    さくら坂沿い、観光客が結構行き来。車では先の通り抜けしづらいが、ホテル用のタクシーもよく通る。
  perceive_enter: ''
  environment_hint:
    indoor: true
    roof: true
    grade: gentle
