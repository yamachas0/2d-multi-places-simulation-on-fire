    grade: flat
- name: 食肉市場
  type: industrial
  perceive_pass: |-
    もともと屠殺場、市場関係者のみ立ち入るエリア。町としては閉鎖的な場所だが、駅前にこの規模が残る。風向きによって独特の匂いが流れる。
  perceive_enter: ''
  environment_hint:
    indoor: false
    roof: false
    grade: flat
    is_meat_market: true
- name: 品川シーズンテラス
  type: office_lobby
  perceive_pass: |-
    1Fはほぼ駐車場で閉鎖的、コンビニ程度。エスカレーター/階段で2Fに誘導される。
  perceive_enter: |-
    2Fが商業店舗(カフェからレストランまで)、北側が公園に面してテラス席など雰囲気のいい店。3Fがオフィスロビーとカンファレンス。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
    near_park: true
- name: 浄水場
  type: industrial
  perceive_pass: |-
    一般人は入れない、中の様子も外からはあまり見えない。広い敷地。
  perceive_enter: ''
  environment_hint:
    indoor: false
    roof: false
    grade: flat
