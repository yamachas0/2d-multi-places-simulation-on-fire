# ===== 品川FW 施設コンテキスト編集用 / perceive文 事実ベース拡充案 =====
# 方針: 主観評価語を避け、外から見える要素・入った時に取得できる構造情報を中心に記述。
# perceive_pass : 中に入らず、外部・通過時に観測できる情報。
# perceive_enter: 入れる場合は内部構成、入れない場合は入場不可・観測限界を明記。
# ============================================================

places:
- name: 品川プリンスホテル
  type: hotel
  perceive_pass: |-
    高輪口の正面側に複数のホテル棟と低層部がまとまって見える。ホテル出入口、タクシー・バスの車寄せ、横断歩道からの歩行者動線が重なる。敷地内に水族館、映画館、ボウリング、ライブホールなどの案内サインがある。
  perceive_enter: |-
    ロビー階には宿泊受付、待合、カフェ・レストラン系の店舗がある。館内動線からアクアパーク品川、T・ジョイPRINCE品川、ボウリングセンターなどのエンタメ施設へ分岐する。宿泊者、観光客、イベント利用者、飲食利用者が同じ建物群を使う。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: アトレ品川
  type: restaurant
  perceive_pass: |-
    東西自由通路に面した駅直結型の商業施設で、2階レベルに主要な出入口がある。外からは駅通路沿いの店舗ファサード、上階へ向かうエスカレーター、飲食・物販のサインが見える。駅利用者の通過動線と店舗利用者の滞留が同じ通路上に発生する。
  perceive_enter: |-
    内部は複数階に飲食・物販店舗が配置され、エスカレーターとエレベーターで上下移動する。通路幅は駅コンコースより限定され、店舗前に行列や待合が発生する場合がある。上階にはレストラン区画、カフェ区画、トイレなどがある。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: 高輪の森公園
  type: park
  perceive_pass: |-
    柘榴坂側から細い入口を経由して到達する公園で、周囲をホテル敷地と工事エリアに囲まれている。外周からは樹木のまとまり、斜面、園路の入口が見える。駅前の大通りから直接見通せる場所ではない。
  perceive_enter: |-
    園内は高低差のある樹林地と園路で構成される。平坦な広場は限られ、斜面に沿って移動する。地域利用向けの遊び場やイベント利用が行われることがある。
  environment_hint:
    indoor: false
    roof: false
    grade: steep
    near_park: true
- name: 品川水族館
  type: department_store
  perceive_pass: |-
    品川プリンスホテル敷地内の水族館施設として案内され、ホテル・映画館・ボウリング等と同じ来街者動線上にある。外部からは施設入口、チケット・入場案内、家族連れや観光客の待合が見える。駅高輪口からプリンスホテル方面へ向かう歩行者動線に接続する。
  perceive_enter: |-
    内部は屋内型の展示施設で、水槽展示、演出空間、ショー・イベント用の空間が連続する。照度は展示に合わせて抑えられ、順路に沿って鑑賞する構成になっている。物販・飲食・トイレ等の来館者向け機能が併設される。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: ウィング高輪
  type: restaurant
  perceive_pass: |-
    京急第1ビル側の低層商業で、国道15号側とプリンスホテル側の動線をつなぐ。坂道状の屋外・半屋外のカスケード動線に沿って店舗入口やサインが並ぶ。上方へ進むと水族館・映画館方面の案内に接続する。
  perceive_enter: |-
    内部・半屋外部に飲食・物販店舗が段状に配置される。階段、エスカレーター、スロープ状の通路が組み合わさり、駅前の平面移動からホテル敷地側の高低差へ切り替わる。店舗利用者と通過者が同じカスケード動線を使う。
  environment_hint:
    indoor: true
    roof: true
    grade: gentle
- name: アレア品川
  type: office_lobby
  perceive_pass: |-
    港南口デッキ北側に接続する業務・商業複合ビルで、2階レベルに飲食店とオフィスロビーがある。1階とは吹き抜け空間とエスカレーターで接続している。デッキを北へ進む動線と、地上階へ降りる動線の分岐点になる。
  perceive_enter: |-
    内部は2階のロビー・店舗区画と1階の飲食区画に分かれる。1階から外へ出るとNTT品川TWINS方面へ進めるが、シーズンテラス方面へは道路側の屋外動線を経由する。建物内だけで港南北側の主要施設へ連続的に抜ける構造ではない。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: 税務署
  type: utility
  perceive_pass: |-
    柘榴坂上側にある行政施設で、周辺のホテル・商業施設とは異なる用途の建物として見える。外部には庁舎名、出入口、掲示・案内類がある。来庁目的の歩行者が出入りするが、観光・飲食目的の滞留は発生しにくい。
  perceive_enter: |-
    内部は窓口、待合、案内表示、申告・相談等の行政手続き空間で構成される。入館者は手続き目的の来庁者が中心になる。用件のない滞在や回遊を前提とした施設ではない。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: グランドプリンス新高輪
  type: hotel
  perceive_pass: |-
    高輪側の丘陵地に建つ大型ホテルで、車寄せ、庭園側への動線、宴会・会議利用の案内が見える。駅前からは坂を上がって到達する位置にある。周辺にはプリンスホテル群の建物と庭園系の外部空間が連続する。
  perceive_enter: |-
    内部にはホテルロビー、客室動線、宴会・会議施設への動線がある。大規模なイベント時は受付、案内板、参加者の待合が発生する。ホテル利用者以外でもレストラン・宴会・会議目的で入館する場合がある。
  environment_hint:
    indoor: true
    roof: true
    grade: steep
- name: 国際会議場
  type: utility
  perceive_pass: |-
    プリンスホテル群の西側に位置する会議・イベント施設で、外部からは大きな建物ボリュームとイベント案内・搬入口系の要素が見える。通常の商業店舗のような路面の賑わいは少ない。開催日には受付や誘導サインが外部にも出る場合がある。
  perceive_enter: |-
    内部はホール、会議室、ホワイエ、受付・クローク等のイベント利用機能で構成される。利用は催事・会議・宴会等の予約や参加目的が中心になる。非開催時は一般来街者が滞在する用途は限定される。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: プリンスさくらタワー
  type: hotel
  perceive_pass: |-
    さくら坂沿いにあるホテルで、坂道、車寄せ、ホテル入口、庭園側への動線が見える。駅からは高輪側の坂を上るアクセスになる。周辺のグランドプリンス高輪・新高輪と一体のホテルエリアを形成している。
  perceive_enter: |-
    内部はホテルロビー、客室階への縦動線、レストラン・ラウンジ等の宿泊者向け機能で構成される。庭園側へ接続する動線があり、屋内外を切り替えて移動できる。入館者は宿泊、飲食、宴会、会議目的が中心になる。
  environment_hint:
    indoor: true
    roof: true
    grade: gentle
- name: グランドプリンス高輪
  type: hotel
  perceive_pass: |-
    高輪側の坂上にあるホテルで、道路側からは低層部、車寄せ、庭園への入口が見える。周囲はホテル群、庭園、坂道で構成され、駅前商業の通路とは異なる敷地内動線になる。徒歩では高輪口から坂を上がる必要がある。
  perceive_enter: |-
    内部はロビー、レストラン、宴会・宿泊動線で構成される。庭園側への出入口があり、複数のプリンスホテル施設間を屋内外で移動できる。宿泊者、宴会・会議参加者、飲食利用者が主な利用者になる。
  environment_hint:
    indoor: true
    roof: true
    grade: gentle
- name: 工事中（A地区）
  type: construction
  perceive_pass: |-
    高輪ゲートウェイシティ周辺の大規模開発エリアで、仮囲い、工事ゲート、重機、搬入車両の動線が見える。歩行者は仮設歩道や誘導サインに従って周辺を通過する。工事範囲により見通しや通行ルートが変化する。
  perceive_enter: |-
    工事区域内は一般立入不可。内部には施工ヤード、資材置き場、仮設事務所、搬入・搬出動線がある想定だが、来街者が直接観察できる範囲は仮囲い外から見える部分に限られる。シミュレーション上は入場不可として扱う。
  environment_hint:
    indoor: false
    roof: false
    grade: flat
    near_construction: true
- name: 品川セントラルガーデン
  type: plaza
  perceive_pass: |-
    品川インターシティと品川グランドコモンズの間に南北方向へ伸びる歩行者空間で、幅のある緑地と舗装された通路が連続する。上部には両側のビルを接続するデッキが横断している。ベンチ、植栽、階段、店舗入口が広場沿いに配置される。
  perceive_enter: |-
    内部は南北に長い歩行空間で、中央の通路、植栽帯、ベンチ、建物低層部の店舗・ロビー接続部が並ぶ。北側と南側で周辺道路との接続があり、駅から離れるほど人の流れは分散する。上空デッキの下は日陰や雨を避けられる部分がある。
  environment_hint:
    indoor: false
    roof: false
    grade: flat
    near_construction: false
    near_park: true
- name: 芝浦中央公園
  type: park
  perceive_pass: |-
    品川シーズンテラス北側に接する人工地盤上の公園で、芝生、花壇、園路が見える。周囲にはオフィスビル、浄水場関連施設、高輪ゲートウェイ方面の開発エリアがある。公園入口はシーズンテラス側や周辺道路側から接続する。
  perceive_enter: |-
    園内は芝生広場、花壇、バラ園、園路、ベンチ等で構成される。犬の散歩、休憩、通過、昼休み利用など複数の利用が発生する。将来的な周辺開発により高輪ゲートウェイ方面との歩行者接続が変わる可能性がある。
  environment_hint:
    indoor: false
    roof: false
    grade: flat
    near_park: true
- name: 品川グランドコモンズ
  type: office_lobby
  perceive_pass: |-
    港南口南側に連なるオフィス群で、2階デッキ、低層店舗、オフィスロビー、品川セントラルガーデンへの接続が見える。駅からデッキで雨に当たりにくくアクセスできる。建物群はセントラルガーデンの西側に面している。
  perceive_enter: |-
    内部は各棟のオフィスロビー、飲食・サービス店舗、共用通路で構成される。デッキや地上階を経由してセントラルガーデン、インターシティ、港南口方面へ接続する。オフィスワーカーの出退勤、昼食、来客受付の動線が重なる。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: 品川インターシティ
  type: office_lobby
  perceive_pass: |-
    港南口南側、品川セントラルガーデンの東側に並ぶ大型オフィス・商業複合施設で、デッキ、アトリウム、店舗入口が見える。駅からは港南口デッキまたはセントラルガーデン経由で到達する。建物低層部は通路と店舗が連続する。
  perceive_enter: |-
    内部はオフィスロビー、飲食・物販店舗、イベント利用される共用空間、デッキ接続部で構成される。A棟・B棟等の複数棟を通路で移動できる。セントラルガーデン側と港南側道路の両方へ抜けられる。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: 港南口広場
  type: plaza
  perceive_pass: |-
    品川駅東側の駅前広場で、駅コンコース、アトレ、アレア品川、グランドコモンズ・インターシティ方面のデッキが接続する。広場上部には屋根があり、階段・エスカレーターで地上交通へ降りる。正面の道路沿いには飲食店街の看板が連続する。
  perceive_enter: |-
    地上階にはタクシー乗り場、バス・車両動線、横断歩道、飲食店街への入口がある。デッキ階と地上階の移動は複数の階段・エスカレーターで分散する。アレア品川側にはタクシー乗り場へ直接降りる階段がある。
  environment_hint:
    indoor: false
    roof: true
    grade: flat
- name: NTT
  type: office_lobby
  perceive_pass: |-
    港南北側にある大規模オフィスビルで、外部からは大きな建物ボリューム、1階ロビー、車寄せ・管理用出入口が見える。低層部に通行者向けの飲食・物販店舗は少ない。道路沿いの歩行者動線は建物外周を通過する形になる。
  perceive_enter: |-
    ロビーには受付、セキュリティ、待合スペースがある。一般来街者が目的なく長時間滞在する用途は限定される。建物内の主用途はオフィスで、上階への移動は入館管理の対象になる。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: コクヨ
  type: office_lobby
  perceive_pass: |-
    品川駅港南側にある本社・ショールーム系の建物で、道路側からショールーム入口、展示サイン、オフィス入口が見える。北館側には来客向けのショールーム機能がある。周辺には中小規模のオフィス・店舗ビルが続く。
  perceive_enter: |-
    内部には家具・文具・オフィス関連の展示空間と、来客受付・商談動線がある。南館側ではライブオフィス的に執務の様子が外部や来客動線から見える部分がある。展示、商談、オフィス利用が同じブランド体験として配置される。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: ソニー
  type: office_lobby
  perceive_pass: |-
    港南側のオフィスビルで、1階ロビーのガラス越しに展示物、椅子・テーブル、カフェが見える。道路側から建物入口とロビー内の滞留スペースを確認できる。周辺のオフィスワーカーや来客の通行がある。
  perceive_enter: |-
    ロビーには過去製品等の展示、待合席、カフェ機能がある。来館者は展示を見ながら短時間滞在できる。上階オフィスへは受付・セキュリティを経由する。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: 繁華街
  type: restaurant
  perceive_pass: |-
    港南口地上階の駅前道路沿いに、居酒屋、バー、飲食店、カラオケ等の看板が連続する。建物は中小規模で、1階店舗と上階店舗の入口が道路に面して並ぶ。歩道上にはメニュー看板、階段入口、エレベーター案内が出る場合がある。
  perceive_enter: |-
    各店舗内は飲食・接客用途で、客席、カウンター、個室、厨房、レジ等で構成される。上階店舗は狭い階段やエレベーターでアクセスすることが多い。夜間は店舗照明と看板の視認性が上がる。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: 食肉市場
  type: industrial
  perceive_pass: |-
    港南口近くにある市場施設で、外周には塀・門・搬入出用の車両動線がある。一般来街者が自由に通り抜ける街区ではなく、周辺道路から敷地規模と市場関連車両を確認できる。風向きや時間帯により市場由来の匂いを感じる場合がある。
  perceive_enter: |-
    市場区域内は関係者・業務車両中心の施設で、一般の街歩き対象として自由入場する前提ではない。内部には荷捌き、処理、保管、管理、車両待機等の業務空間がある。シミュレーション上は原則として外周観察に留める。
  environment_hint:
    indoor: false
    roof: false
    grade: flat
    is_meat_market: true
- name: 品川シーズンテラス
  type: office_lobby
  perceive_pass: |-
    港南北側にある大型オフィス・商業複合施設で、1階は駐車場・車両動線・コンビニ等が見える。歩行者は階段・エスカレーターで2階の商業・広場レベルへ誘導される。北側は芝浦中央公園に面し、テラス席や外部階段がある。
  perceive_enter: |-
    2階には飲食店、カフェ、クリニック等のオフィスサポート機能が配置される。3階にはオフィスロビーとカンファレンス施設がある。公園側の店舗は屋外席やガラス面を介して公園と接続する。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
    near_park: true
- name: 浄水場
  type: industrial
  perceive_pass: |-
    港南北側から芝浦中央公園周辺にかけて大きなインフラ敷地として存在し、外部からはフェンス、管理用出入口、設備建物の一部が見える。一般歩行者が自由に横断できる街区ではない。周辺の歩行者動線は敷地外周を回り込む。
  perceive_enter: |-
    施設内は水処理・管理・設備運用のためのインフラ空間で、一般来街者が入る前提ではない。内部体験は通常のフィールドワーク対象外とし、観察情報は外周から見える設備・フェンス・管理動線に限定する。
  environment_hint:
    indoor: false
    roof: false
    grade: flat
- name: 工事中（D地区）
  type: construction
  perceive_pass: |-
    高輪ゲートウェイ周辺の開発・工事エリアで、仮囲い、工事車両出入口、誘導員、仮設歩道が見える。周辺の歩行ルートは工事フェーズに応じて切り替わる。外からは建設中の躯体、クレーン、資材搬入の様子が見える場合がある。
  perceive_enter: |-
    工事区域内は一般立入不可。内部には施工区画、仮設事務所、資材置き場、重機動線がある想定だが、来街者は直接体験できない。シミュレーション上は入場不可として扱う。
  environment_hint:
    indoor: false
    roof: false
    grade: flat
    near_construction: true
- name: （関東閣）
  type: residential
  perceive_pass: |-
    高輪側の坂道沿いにある住宅・滞在系の施設で、道路からは敷地境界、出入口、植栽、建物外観が見える。周辺はホテル・公園・住宅系用途が混在し、駅前商業より歩行者密度は低い。敷地内への自由な通り抜けは前提にならない。
  perceive_enter: |-
    内部は関係者・利用者向けの施設として扱い、一般来街者の自由入場は想定しない。入館できる場合も、受付、共用部、居室・会議等の私的領域に分かれる。フィールドワーク情報は外部から確認できる範囲を基本にする。
  environment_hint:
    indoor: true
    roof: true
    grade: gentle
- name: ave高輪
  type: office_lobby
  perceive_pass: |-
    国道15号沿い東側にある比較的新しいオフィスビルで、外部階段がファサード要素として見える。駅ビル工事現場の北側に位置し、道路沿いの歩行者動線に面している。低層部の出入口、サイン、階段の上下動線を外部から確認できる。
  perceive_enter: |-
    内部はオフィスロビーと上階オフィスへの動線で構成される。外部階段によりフロア間移動の一部が屋外から視認できる。上階オフィスは入館管理の対象になる。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: JR改札
  type: subway_station
  perceive_pass: |-
    東西自由通路中央付近にあるJR在来線改札で、ガラス屋根・大きな開口・時計・案内サインが見える。改札前には待ち合わせ、乗換、通過の人流が重なる。券売機、みどりの窓口・案内系機能、駅ナカ入口のサインが周辺にある。
  perceive_enter: |-
    改札内にはエキナカ店舗、コンコース、各ホームへ下りる階段・エスカレーター・エレベーターがある。山手線、京浜東北線、東海道線、横須賀線等への乗換動線が分岐する。改札内外で店舗利用と鉄道利用の人流が交差する。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: 京急改札
  type: subway_station
  perceive_pass: |-
    高輪口側にある京急線改札で、JR改札から高輪側へ下る動線の先に位置する。周辺は工事中の仮設的な階段、エレベーター、案内サインが見える。JR側の広い通路に比べて改札前空間は限定される。
  perceive_enter: |-
    改札内は京急本線ホームへ向かう縦動線とコンコースで構成される。羽田空港方面、横浜方面、泉岳寺・都心方面への列車案内が表示される。ホーム幅や待機空間は限定され、乗降・乗換の人流が短い距離で集中する。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: 東西自由通路
  type: pedestrian_street
  perceive_pass: |-
    品川駅の高輪口側と港南口側を結ぶ屋内歩行者通路で、駅改札、商業施設入口、案内サイン、待ち合わせ場所が連続する。通路は屋根付きで、鉄道利用者、通勤者、観光客、店舗利用者が混在する。東西方向の移動に加えて、改札・商業・デッキへの分岐が多数ある。
  perceive_enter: |-
    通路内にはJR改札、新幹線改札、アトレ入口、港南口デッキ、高輪口方面の階段・エスカレーターが接続する。柱、サイン、店舗入口、待ち合わせ者によって歩行ラインが分かれる。雨天時も主要な東西移動が屋内で完結する。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: 新幹線改札
  type: subway_station
  perceive_pass: |-
    東西自由通路の港南口寄りにある東海道新幹線改札で、改札口、券売機、待合・案内サイン、土産物・飲食店舗が周辺に配置される。大きな荷物を持つ利用者、出張者、観光客が出入りする。JR在来線改札や港南口デッキと近接している。
  perceive_enter: |-
    改札内には新幹線コンコース、待合、売店、飲食、ホームへの階段・エスカレーターがある。乗車前の待機、弁当・土産購入、在来線乗換の動線が重なる。改札内外で荷物を持った利用者の移動速度が変化する。
  environment_hint:
    indoor: true
    roof: true
    grade: flat
- name: パチンコ屋
  type: restaurant
  perceive_pass: |-
    高輪口側の坂道・商業建物の一角にある娯楽施設で、外部からは店名サイン、照明、入口、景品交換・駐輪等の周辺要素が見える。駅前商業や飲食店舗の並びの中に配置される。入口付近では入退店者と通行者の動線が接する。
  perceive_enter: |-
    内部は遊技台、通路、カウンター、景品交換関連の案内、喫煙・休憩系設備で構成される。音量、照明、台配置は屋外通路とは異なる環境条件になる。利用者は遊技目的で一定時間滞在する。
  environment_hint:
    indoor: true
    roof: true
    grade: gentle
- name: 工事中（駅ビル）
  type: construction
  perceive_pass: |-
    品川駅高輪口側の駅ビル工事エリアで、仮囲い、仮設通路、工事ゲート、案内サインが見える。歩行者動線は工事区画を避けて設定され、階段・エレベーター・仮設通路に誘導される。工事の進捗により視界、通路幅、接続先が変わる。
  perceive_enter: |-
    工事区域内は一般立入不可。内部には施工ヤード、資材搬入、重機・作業員動線、仮設設備がある想定だが、来街者が取得できる情報は外部から見える工事状況に限定される。シミュレーション上は入場不可として扱う。
  environment_hint:
    indoor: false
    roof: false
    grade: flat
    near_construction: true
- name: 工事中（駅ビル）
  type: construction
  perceive_pass: |-
    品川駅高輪口側の駅ビル工事エリアで、仮囲い、仮設通路、工事ゲート、案内サインが見える。歩行者動線は工事区画を避けて設定され、階段・エレベーター・仮設通路に誘導される。工事の進捗により視界、通路幅、接続先が変わる。
  perceive_enter: |-
    工事区域内は一般立入不可。内部には施工ヤード、資材搬入、重機・作業員動線、仮設設備がある想定だが、来街者が取得できる情報は外部から見える工事状況に限定される。シミュレーション上は入場不可として扱う。
  environment_hint:
    indoor: false
    roof: false
    grade: flat
    near_construction: true
- name: 高輪公園
  type: park
  perceive_pass: |-
    高輪側の住宅・ホテルエリアにある公園で、外部からは園名サイン、階段・坂道、植栽、遊具や広場の一部が見える。周辺道路には高低差があり、駅前からは坂を上って到達する。隣接して住宅・学校・ホテル系の用途がある。
  perceive_enter: |-
    園内は高低差のある地形に沿って園路、階段、植栽、遊具・広場等が配置される。平坦な駅前広場とは異なり、上下移動を伴う。地域住民の休憩、子どもの遊び、通過利用が想定される。
  environment_hint:
    indoor: false
    roof: false
    grade: steep
    near_park: true
- name: 工事中（北口広場）
  type: construction
  perceive_pass: |-
    品川駅北側・高輪ゲートウェイ方面の広場整備に関連する工事エリアで、仮囲い、工事車両出入口、歩行者誘導サインが見える。駅周辺の既存動線と将来動線の切り替え地点になる。外部からは舗装、基盤整備、構造物の施工状況が見える場合がある。
  perceive_enter: |-
    工事区域内は一般立入不可。内部は広場・歩行者動線・インフラ整備の施工区画として扱う。シミュレーション上は外周から確認できる仮囲い、誘導、接続先の変化を観測情報とする。
  environment_hint:
    indoor: false
    roof: false
    grade: flat
    near_construction: true
- name: エキナカ
  type: restaurant
  perceive_pass: |-
    JR改札内外に連続する駅商業で、飲食、弁当、土産、物販、カフェ等の店舗サインが見える。鉄道利用者の通過動線に沿って小規模店舗が並ぶ。時間帯により改札・ホーム移動と購買行動が同じ通路上で重なる。
  perceive_enter: |-
    内部は改札内コンコース沿いの店舗、レジ列、立ち食い・テイクアウト、待合・トイレ等で構成される。ホームへ向かう縦動線と店舗利用の滞留が近接する。新幹線利用者向けの弁当・土産需要と在来線利用者向けの日常購買が混在する。
  environment_hint:
    indoor: true
    roof: true
    grade: gentle
