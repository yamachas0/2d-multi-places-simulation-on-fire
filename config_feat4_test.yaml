# Feature 4 smoke test: 3-layer behavior model with transit caching
# (6 agents x 15 steps — enough to observe transit reuse)
simulation:
  duration: 15
  half_space_size: 75
  half_place_size: 5
  time_scale:
    step_duration_minutes: 1
    start_time: "08:00"

agents:
  num_agents: 6
  communication_radius: 10
  memory_limit: 20
  memory_size: 5
  message_history_limit: 10
  message_context_size: 3
  skip_probability: 0.0        # turn off random skip so we isolate layer-caching
  parallel_workers: 6
  movement_speed:
    base_cells_per_step: 8
    variance: 2

  personas:
    - id: 0
      name: "田中健一"
      age: 42
      gender: "male"
      occupation: "IT会社員"
      background: "最近転勤で引っ越してきた"
      speech_style: "丁寧だが少し堅い"
    - id: 1
      name: "鈴木美咲"
      age: 28
      gender: "female"
      occupation: "フリーランスデザイナー"
      background: "この街に長く住んでいる"
      speech_style: "カジュアルでフレンドリー"
    - id: 2
      name: "佐藤太郎"
      age: 65
      gender: "male"
      occupation: "定年退職"
      background: "散歩が日課"
      speech_style: "のんびりした話し方"

places:
  - name: "central_station"
    type: "station"
    center_x: 0
    center_y: 60
    half_size_x: 15
    half_size_y: 6
    capacity: 40
  - name: "station_plaza"
    type: "plaza"
    center_x: 0
    center_y: 35
    half_size_x: 10
    half_size_y: 6
    capacity: 25
  - name: "north_cafe"
    type: "cafe"
    center_x: -30
    center_y: 15
    half_size_x: 6
    half_size_y: 5
    capacity: 15
  - name: "south_bar"
    type: "bar"
    center_x: 40
    center_y: -10
    half_size: 5
    capacity: 12
  - name: "city_library"
    type: "library"
    center_x: -45
    center_y: -25
    half_size_x: 8
    half_size_y: 6
    capacity: 30
  - name: "riverside_park"
    type: "park"
    center_x: 20
    center_y: -45
    half_size_x: 15
    half_size_y: 8
    capacity: 40

llm:
  model: "claude-haiku-4-5-20251001"
  base_url: "https://api.anthropic.com"
  temperature: 0.2
  max_tokens: 600

fires: []

visualization:
  save_frames: false
  frame_interval: 1
  output_dir: "output_feat4_test"

logging:
  level: "INFO"
  log_file: "simulation_feat4_test.log"
