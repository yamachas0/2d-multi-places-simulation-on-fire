# ================================================================
# shinagawa navigation smoke test config
# ================================================================
# Built by tools/build_shinagawa_run_config.py
#
# Purpose:
#   Validate that the Navigator (road mask + BFS + apron-jump) lets
#   agents move across the simplified shinagawa field without
#   getting stuck. NO fires / NO events so behavior is isolated.
#
# Sources:
#   scene : shinagawa_config.merged.yaml  (places + scene_3d)
#   sim   : config_jr_disruption.yaml (simulation + agents.personas + llm)
#
# Overrides:
#   - half_space_size forced to 80 (shinagawa scale)
#   - num_agents capped to 20 / max_agents 25 (smoke test size)
#   - fires / events set to [] for clean nav observation
# ================================================================

metadata:
  name: 品川駅周辺 400m圏
  description: JR/京急品川駅を中心に半径400m圏の都市シーン
  half_space_size: 80
  meters_per_cell: 5
  generated_from: Claude chat 3D widget iteration
proposed_type_extensions:
- hotel
- residential
- industrial
- utility
- construction
- zone_izakaya
- museum
simulation:
  duration: 60
  half_space_size: 80
  half_place_size: 5
  seed: 42
  time_scale:
    step_duration_minutes: 1
    start_time: '17:00'
    patterns:
    - hours:
      - 17
      - 18
      enter_per_step: 0.3
      exit_per_step: 0.03
      neighborhood_mood: 夕方の帰宅ラッシュ。駅は人で溢れ、街へ帰宅客が流れる
      default_goal: 退勤・帰宅中
    - hours:
      - 19
      - 20
      enter_per_step: 0.15
      exit_per_step: 0.06
      neighborhood_mood: ラッシュが落ち着き、夕食や飲みに出る人が混ざる
      default_goal: 夕食・寄り道
