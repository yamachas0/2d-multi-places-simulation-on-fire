# Simulation Configuration — station-front urban district (150x150, ~5m per cell)

simulation:
  duration: 60              # 60 steps = 1 hour of wall-clock time
  half_space_size: 75       # 150x150 grid, ~750m x 750m
  half_place_size: 5        # default for legacy square places
  time_scale:
    step_duration_minutes: 1
    start_time: "08:00"
    patterns:
      - hours: [7, 8]
        enter_per_step: 0.25
        exit_per_step: 0.05
        neighborhood_mood: "朝のラッシュ時間帯。通勤客が駅から街に吐き出されてくる"
        default_goal: "通勤・通学中"
      - hours: [9, 10, 11]
        enter_per_step: 0.10
        exit_per_step: 0.08
        neighborhood_mood: "ラッシュが落ち着き、街に人が残り始める時間帯"
        default_goal: "朝のひと仕事・散歩・買い物"
      - hours: [12, 13]
        enter_per_step: 0.08
        exit_per_step: 0.08
        neighborhood_mood: "昼休みで駅前の人通りが増えている"
        default_goal: "昼休み・ランチ"
      - hours: [17, 18, 19]
        enter_per_step: 0.10
        exit_per_step: 0.20
        neighborhood_mood: "帰宅ラッシュで駅に人が集まる"
        default_goal: "帰宅途中・一杯寄り道"

agents:
  num_agents: 30
  max_agents: 40
  communication_radius: 10
  memory_limit: 20
  memory_size: 5
  message_history_limit: 10
  message_context_size: 3
  skip_probability: 0.2
  parallel_workers: 15
  movement_speed:
    base_cells_per_step: 8
    variance: 2

  personas:
    # === Pair 1: 夫婦 (agents 0 and 1 live together) ===
    - id: 0
      name: "田中健一"
      age: 42
      gender: "male"
      occupation: "IT会社員"
      background: "最近この街に引っ越してきた。妻の美咲と暮らしている"
      speech_style: "丁寧だが少し堅い。敬語多め。初対面には警戒気味"
      current_goal: "駅前で妻と合流して朝食に行く"
      talkativeness: 0.2
      cognitive_biases:
        - "人見知りで初対面は警戒"
        - "内向的で大勢の集団は苦手"
      social_identities:
        - group_name: "田中家"
          scale: "micro"
          base_salience: 0.9
          norms: "家族を大切にする"
          member_ids: [1]
          in_group_bias: 0.95
      initial_relationships:
        1: 0.95

    - id: 1
      name: "田中美咲"
      age: 38
      gender: "female"
      occupation: "フリーランスデザイナー"
      background: "この街に長く住んでいる。夫の健一と暮らしている。社交的"
      speech_style: "カジュアルでフレンドリー。タメ口混じり"
      current_goal: "駅前で夫と合流して朝食に行く"
      talkativeness: 0.5
      cognitive_biases:
        - "社交的で知らない人にも話しかけやすい"
      social_identities:
        - group_name: "田中家"
          scale: "micro"
          base_salience: 0.9
          norms: "家族を大切にする"
          member_ids: [0]
          in_group_bias: 0.95
      initial_relationships:
        0: 0.95

    # === Group 1: 同僚3人 (agents 2, 3, 4 share an office) ===
    - id: 2
      name: "山田太郎"
      age: 35
      gender: "male"
      occupation: "商社マン"
      background: "駅前のオフィスに勤めて10年。同僚の佐藤と鈴木と親しい"
      speech_style: "明るく社交的。同僚には冗談も言う"
      current_goal: "通勤中、同僚と合流できたら朝のコーヒーへ"
      talkativeness: 0.4
      cognitive_biases:
        - "仲間意識が強い"
      social_identities:
        - group_name: "株式会社テックビジョン"
          scale: "meso"
          base_salience: 0.7
          norms: "同僚と協力しつつ効率的に動く"
          member_ids: [3, 4]
          in_group_bias: 0.65
      initial_relationships:
        3: 0.65
        4: 0.55

    - id: 3
      name: "佐藤次郎"
      age: 40
      gender: "male"
      occupation: "商社マン"
      background: "山田・鈴木と同じ会社の同僚。落ち着いた人"
      speech_style: "丁寧な敬語。同僚相手でも少し距離を置く"
      current_goal: "通勤中、同僚と合流できたら朝のコーヒーへ"
      talkativeness: 0.25
      cognitive_biases:
        - "物静かで大勢では聞き役に回る"
      social_identities:
        - group_name: "株式会社テックビジョン"
          scale: "meso"
          base_salience: 0.7
          norms: "同僚と協力しつつ効率的に動く"
          member_ids: [2, 4]
          in_group_bias: 0.65
      initial_relationships:
        2: 0.65
        4: 0.60

    - id: 4
      name: "鈴木三郎"
      age: 33
      gender: "female"
      occupation: "商社マン"
      background: "山田・佐藤と同じ会社の同僚。若手でよく喋る"
      speech_style: "カジュアルで明るい。タメ口混じり"
      current_goal: "通勤中、同僚と合流できたら朝のコーヒーへ"
      talkativeness: 0.5
      cognitive_biases:
        - "好奇心旺盛で話題を広げるのが好き"
      social_identities:
        - group_name: "株式会社テックビジョン"
          scale: "meso"
          base_salience: 0.7
          norms: "同僚と協力しつつ効率的に動く"
          member_ids: [2, 3]
          in_group_bias: 0.65
      initial_relationships:
        2: 0.55
        3: 0.60

    # === Solo: 初対面ネットワーク (agent 5 knows no one) ===
    - id: 5
      name: "高橋四郎"
      age: 65
      gender: "male"
      occupation: "定年退職したサラリーマン"
      background: "毎日このあたりを散歩している常連。特に仲の良い相手はいない"
      speech_style: "のんびりした話し方。昔話を交えることが多い"
      current_goal: "いつもの散歩コースを歩く"
      talkativeness: 0.2
      cognitive_biases:
        - "人は好きだが自分から深く話しかけはしない"

# Place layout: station at the north edge, plaza in front, mixed venues spread
# across the district. Rectangular places use half_size_x / half_size_y; square
# places keep the legacy `half_size` shorthand.
places:
  - name: "central_station"
    type: "station"
    center_x: 0
    center_y: 60
    half_size_x: 15
    half_size_y: 6
    capacity: 40
    social_likelihood: 0.05    # 通勤中、話しかけにくい
  - name: "station_plaza"
    type: "plaza"
    center_x: 0
    center_y: 35
    half_size_x: 10
    half_size_y: 6
    capacity: 25
    social_likelihood: 0.2     # 駅前広場。知人にはちょっと声かける程度
  - name: "north_cafe"
    type: "cafe"
    center_x: -30
    center_y: 15
    half_size_x: 6
    half_size_y: 5
    capacity: 15
    social_likelihood: 0.35    # カフェ。気軽に話しやすい
  - name: "south_bar"
    type: "bar"
    center_x: 40
    center_y: -10
    half_size: 5
    capacity: 12
    social_likelihood: 0.7     # 居酒屋。最も社交的
  - name: "city_library"
    type: "library"
    center_x: -45
    center_y: -25
    half_size_x: 8
    half_size_y: 6
    capacity: 30
    social_likelihood: 0.05    # 図書館。静かにする場所
  - name: "riverside_park"
    type: "park"
    center_x: 20
    center_y: -45
    half_size_x: 15
    half_size_y: 8
    capacity: 40
    social_likelihood: 0.25    # 公園。ベンチ等で軽い会話

llm:
  provider: "google"
  model: "gemini-3.1-flash-lite-preview"
  base_url: "https://generativelanguage.googleapis.com"
  temperature: 0.2
  max_tokens: 400

fires:
  - name: "fire_1"
    start_step: 40
    intensity: 0.8
    radius: 25
    center_x: 20
    center_y: -45

visualization:
  save_frames: true
  frame_interval: 1
  output_dir: "output"
  focus_agent_id: 1          # 鈴木美咲を主人公として追跡

logging:
  level: "INFO"
  log_file: "simulation.log"
