llm:
  provider: "google"
  model: "gemini-2.5-flash-lite"
  base_url: "https://generativelanguage.googleapis.com"
  temperature: 0.2
  max_tokens: 400

# Phase 2 用: 火災は無効。代わりに transit_disruption イベントを仕込む。
fires: []

events:
  - name: "jr_shinagawa_outage"
    type: "transit_disruption"
    # Phase 2.5: 17:15 に発生させる (1step = 1分, start_time "17:00")。
    # 駅に人が溜まりきったあとで運休を起こし、影響を最大化する意図。
    start_step: 15
    end_step: 60
    # Phase 2.6+: 一斉配信モデル。発火時 1 回だけ phone_check_rate で判定し、
    # 外れた人は以降 notification では知らない (path-1 / path-2 のみ)。
    # per-step polling に戻したいときはこのフラグを false にする。
    broadcast_once: true
    affected_place: "JR品川駅"
    description: "JR品川駅 人身事故により山手線・京浜東北線が運転見合わせ。振替輸送は地下鉄A駅・B駅を案内中。"
    effects:
      # JR品川駅 からの新規 spawn を停止。
      block_spawn_at: ["JR品川駅"]
      # 代替として地下鉄A/B駅へスポーン加重。multiplier > 1 で
      # random.choices の重みが増え、同時に effective_enter_p も
      # sum(weights)/len(weights) 倍される設計 (_handle_agent_spawning 参照)。
      boost_spawn_at:
        - place: "地下鉄A駅"
          multiplier: 2.0
        - place: "地下鉄B駅"
          multiplier: 2.0
      # JR品川駅 から半径 25 以内の既存エージェントに直接認識を付与。
      notify_agents_within_radius: 25
    # 通勤系 identity の salience を +0.2 して「遅刻やばい」文脈を強める。
    salience_boost_targets:
      - "株式会社テックビジョン"
      - "グローバル商事"

visualization:
  save_frames: true
  frame_interval: 2
  # output_dir 未指定なら main.py の resolve_run_dir() が自動で
  # `simulations/YYYY-MM-DD_HHMM_NN_{run_name}/` を生成する。
  # 特定名を付けたいときは `run_name: xxx` を下に足す (ファイル名 stem から推定されない場合のみ)。
  # run_name: phase26_opt_in
  focus_agent_id: 17            # 石川裕子 (JR通勤の典型、運休の影響を正面から受ける)

logging:
  level: "INFO"
  log_file: "_jr_disruption.log"
