# === Phase 2 検証用 — JR運休シナリオ (機能4.5) ===
#
# config_urban_v2.yaml をベースに、火災 (fires:) の代わりに
# 機能4.5 の transit_disruption イベントを仕込んだ構成。
# 同じ30人 × 60step、同じ都市構造・同じペルソナ・同じ seed で、
# 火災なし・JR運休ありの動線変化を観測する目的の config。

simulation:
  duration: 60
  half_space_size: 75
  half_place_size: 5
  seed: 42
  time_scale:
    step_duration_minutes: 1
    start_time: "17:00"
    patterns:
      # Phase 2.5: 夕方ラッシュ (17:00 スタート) — 帰宅客で駅が最混雑する時間帯。
      # despawn (exit_per_step) をわざと低く抑えて、駅で人が滞留する状況を作る。
      # これにより JR 運休が発動したとき、駅にいる人数自体が多く、避難動線の
      # 観測が意味を持つ。
      - hours: [17, 18]
        enter_per_step: 0.30
        exit_per_step: 0.03
        neighborhood_mood: "夕方の帰宅ラッシュ。駅は人で溢れ、街へ帰宅客が流れる"
        default_goal: "退勤・帰宅中"
      - hours: [19, 20]
        enter_per_step: 0.15
        exit_per_step: 0.06
        neighborhood_mood: "ラッシュが落ち着き、夕食や飲みに出る人が混ざる"
        default_goal: "夕食・寄り道"

agents:
  num_agents: 30
  max_agents: 40
  communication_radius: 10
  memory_limit: 20
  memory_size: 5
  message_history_limit: 10
  message_context_size: 3
  skip_probability: 0.2
  parallel_workers: 15
  movement_speed:
    base_cells_per_step: 8
    variance: 2

