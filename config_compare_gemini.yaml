# Model comparison: Google Gemini 3.1 Flash Lite Preview (10 agents x 20 steps, fire@10).
simulation:
  duration: 20
  half_space_size: 75
  half_place_size: 5
  seed: 42
  time_scale:
    step_duration_minutes: 1
    start_time: "08:00"
    patterns:
      - hours: [7, 8]
        enter_per_step: 0.25
        exit_per_step: 0.05
        neighborhood_mood: "朝のラッシュ時間帯。通勤客が駅から街に吐き出されてくる"
        default_goal: "通勤・通学中"
      - hours: [9, 10, 11]
        enter_per_step: 0.10
        exit_per_step: 0.08
        neighborhood_mood: "ラッシュが落ち着き、街に人が残り始める時間帯"
        default_goal: "朝のひと仕事・散歩・買い物"

agents:
  num_agents: 10
  max_agents: 15
  communication_radius: 10
  memory_limit: 20
  memory_size: 5
  message_history_limit: 10
  message_context_size: 3
  skip_probability: 0.2
  parallel_workers: 3
  movement_speed:
    base_cells_per_step: 8
    variance: 2

  personas:
    - id: 0
      name: "田中健一"
      age: 42
      gender: "male"
      occupation: "IT会社員"
      background: "最近転勤で引っ越してきた。知り合いがいない"
      speech_style: "丁寧だが少し堅い。敬語多め。初対面には警戒気味"
    - id: 1
      name: "鈴木美咲"
      age: 28
      gender: "female"
      occupation: "フリーランスデザイナー"
      background: "この街に長く住んでいる。社交的で顔が広い"
      speech_style: "カジュアルでフレンドリー。タメ口混じり"
    - id: 2
      name: "佐藤太郎"
      age: 65
      gender: "male"
      occupation: "定年退職したサラリーマン"
      background: "毎日このあたりを散歩している常連"
      speech_style: "のんびりした話し方。昔話を交えることが多い"

places:
  - name: "central_station"
    type: "station"
    center_x: 0
    center_y: 60
    half_size_x: 15
    half_size_y: 6
    capacity: 40
  - name: "station_plaza"
    type: "plaza"
    center_x: 0
    center_y: 35
    half_size_x: 10
    half_size_y: 6
    capacity: 25
  - name: "north_cafe"
    type: "cafe"
    center_x: -30
    center_y: 15
    half_size_x: 6
    half_size_y: 5
    capacity: 15
  - name: "south_bar"
    type: "bar"
    center_x: 40
    center_y: -10
    half_size: 5
    capacity: 12
  - name: "city_library"
    type: "library"
    center_x: -45
    center_y: -25
    half_size_x: 8
    half_size_y: 6
    capacity: 30
  - name: "riverside_park"
    type: "park"
    center_x: 20
    center_y: -45
    half_size_x: 15
    half_size_y: 8
    capacity: 40

llm:
  provider: "google"
  model: "gemini-3.1-flash-lite-preview"
  base_url: "https://generativelanguage.googleapis.com"
  temperature: 0.2
  max_tokens: 400

fires:
  - name: "fire_1"
    start_step: 10
    intensity: 0.8
    radius: 25
    center_x: 20
    center_y: -45

visualization:
  save_frames: true
  frame_interval: 1
  output_dir: "output_compare_gemini"
  focus_agent_id: 1

logging:
  level: "INFO"
  log_file: "simulation_compare_gemini.log"
