# Feature 5 smoke test: wall-clock time + station spawn/despawn.
# Short run (4 agents x 20 steps) with high enter/exit probability so spawns
# and despawns actually happen within the window. Starts at 08:55 so we cross
# the 09:00 boundary and see one time_pattern transition.
simulation:
  duration: 20
  half_space_size: 75
  half_place_size: 5
  time_scale:
    step_duration_minutes: 1
    start_time: "08:55"
    patterns:
      - hours: [7, 8]
        enter_per_step: 0.4
        exit_per_step: 0.1
        neighborhood_mood: "朝のラッシュ時間帯。駅から通勤客が吐き出されてくる"
        default_goal: "通勤・通学中"
      - hours: [9, 10, 11]
        enter_per_step: 0.2
        exit_per_step: 0.1
        neighborhood_mood: "ラッシュが落ち着き、街に人が残り始める時間帯"
        default_goal: "朝のひと仕事・散歩・買い物"

agents:
  num_agents: 4
  max_agents: 8
  communication_radius: 10
  memory_limit: 20
  memory_size: 5
  message_history_limit: 10
  message_context_size: 3
  skip_probability: 0.0
  parallel_workers: 6
  movement_speed:
    base_cells_per_step: 8
    variance: 2

  personas:
    - id: 0
      name: "田中健一"
      age: 42
      gender: "male"
      occupation: "IT会社員"
      background: "最近転勤で引っ越してきた"
      speech_style: "丁寧だが少し堅い"
    - id: 1
      name: "鈴木美咲"
      age: 28
      gender: "female"
      occupation: "フリーランスデザイナー"
      background: "この街に長く住んでいる"
      speech_style: "カジュアルでフレンドリー"
    - id: 2
      name: "佐藤太郎"
      age: 65
      gender: "male"
      occupation: "定年退職"
      background: "散歩が日課"
      speech_style: "のんびりした話し方"
    - id: 3
      name: "山田花子"
      age: 34
      gender: "female"
      occupation: "カフェ店員"
      background: "朝の通勤は駅から"
      speech_style: "明るく元気"

places:
  - name: "central_station"
    type: "station"
    center_x: 0
    center_y: 60
    half_size_x: 15
    half_size_y: 6
    capacity: 40
  - name: "station_plaza"
    type: "plaza"
    center_x: 0
    center_y: 35
    half_size_x: 10
    half_size_y: 6
    capacity: 25
  - name: "north_cafe"
    type: "cafe"
    center_x: -30
    center_y: 15
    half_size_x: 6
    half_size_y: 5
    capacity: 15
  - name: "south_bar"
    type: "bar"
    center_x: 40
    center_y: -10
    half_size: 5
    capacity: 12

llm:
  model: "claude-haiku-4-5-20251001"
  base_url: "https://api.anthropic.com"
  temperature: 0.2
  max_tokens: 600

fires: []

visualization:
  save_frames: false
  frame_interval: 1
  output_dir: "output_feat5_test"

logging:
  level: "INFO"
  log_file: "simulation_feat5_test.log"
