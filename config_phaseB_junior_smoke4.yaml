    field_questions:
    - 品川駅周辺で、オフィスビルと昔ながらの寺社がどのように隣接しているのか、その空間的な近さを自分の目で確かめたい。
    - 座学で話に出てきた「人がゆっくりできる場所」が、具体的にどこに、どのような形で存在しているのかを歩きながら探したい。
