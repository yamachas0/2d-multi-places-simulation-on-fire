    initial_memory:
    - '[座学を経て描いた品川の未来像] 品川は、ただの通過点ではなく、色々な人が立ち止まって楽しめるような、新旧がうまく調和した活気のある街になるんじゃないかと思っている。'
    - '[これから現地でどう過ごしたいか] 品川駅前を歩きながら、座学で聞いた「新旧の混在」や「交通の結節点」としての現実をこの目で確かめたい。特に、人がどう動いているのか、どんなお店があるのかを観察して、自分の目で品川のリアルを感じ取りたい。'
    - '[座学で気になっていること 1] 交通の結節点と歴史的場所の混在という複雑さ。'
    - '[座学で気になっていること 2] 「落ち着かない」「ゆっくりできる場所が欲しい」という意見。'
    - '[座学で気になっていること 3] リニア開通でさらにごちゃごちゃする可能性への懸念。'
    - '[現地で自分の目で確かめたい 1] 品川駅周辺で、オフィスビルと昔ながらの寺社がどのように隣接しているのか、その空間的な近さを自分の目で確かめたい。'
    - '[現地で自分の目で確かめたい 2] 座学で話に出てきた「人がゆっくりできる場所」が、具体的にどこに、どのような形で存在しているのかを歩きながら探したい。'
    - '[現地で自分の目で確かめたい 3] 駅周辺の人の流れが、時間帯によってどのように変化するのかを観察し、その賑わいや落ち着きの度合いを肌で感じたい。'
    - '[フィールドワーク全体の自分のテーマ] 品川駅周辺の、新旧の混在する景観と人の動きを自分の五感で確かめたい。'
    - '[前提] これは企業協力型の学外教育プログラムです。午前中に教室で座学を行い、昼食をはさんで、午後 13時から品川駅前に出てフィールドワークをします。FWではいくつかの企業 (水族館・プリンスホテル・京急・トヨタ・税務署・JR・NTT・ソニー・コクヨ・食肉市場・浄水場・日鉄興和不動産) が学生の受け入れ担当を配置していて、訪れれば自社の取り組みと品川の未来について語ってくれます。フィールドは品川駅周辺。100step以内に出発地である港南口広場に戻ります。途中の動きはあなたの判断です。一人で動くか誰かと一緒に動くかも自分で決めて構いません。'
    - '[今日のFW課題] FW中、最低でも 2社以上の企業担当者 (受け入れ拠点) のところを実際に訪ね、自社の取り組みや品川での役割について話を聞いてください。どの企業を選ぶかは自分の興味で決めて構いませんが、必ず 2社以上に立ち寄ること。'
    - '[現在地] 港南口広場。13時に集合してフィールドワークを始めたばかり。座学で議論した知識は頭に入っているが、実際に歩いてどんな光景・動線・人の流れに出会うかは現地次第。'
