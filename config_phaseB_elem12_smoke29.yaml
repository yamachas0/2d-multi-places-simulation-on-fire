    fw_task: "[今日のFW課題] FW中、必ず以下の 2 か所の企業担当者を訪ね、自社の取り組みや品川での役割について話を聞いてください。\n  ① 高梨 みどり さん (拠点: 品川水族館)\n  ② 藤本 健司 さん (拠点: 品川プリンスホテル)\n自分の関心と違う場所が指定されているように見えても、まずは行ってみる。行ってみたからこそ気づけることがある。残りの企業担当者にも余裕があれば立ち寄ってよい。"
    handoff_intent: 品川駅の周りを歩き回って、昔の建物と新しいビルが混ざっている様子を自分の目で確かめたいです。特に、お城みたいに色々なものが合わさっている場所を探したいです。
    handoff_future_image: 品川は、昔の宿場町のような趣と、新しいビルや速い電車のような未来的なものが混ざり合って、お城のようにワクワクする街になっていくと思います。
    handoff_key_memories:
    - 品川は昔、宿場町だったと知った。
    - 昔の建物と新しいビルが合わさっている様子がお城みたいでワクワクする。
    - リアムのお父さんから、昔はもっとごちゃごちゃしていたと聞いた。
    initial_memory:
    - '[座学を経て描いた品川の未来像] 品川は、昔の宿場町のような趣と、新しいビルや速い電車のような未来的なものが混ざり合って、お城のようにワクワクする街になっていくと思います。'
    - '[これから現地でどう過ごしたいか] 品川駅の周りを歩き回って、昔の建物と新しいビルが混ざっている様子を自分の目で確かめたいです。特に、お城みたいに色々なものが合わさっている場所を探したいです。'
    - '[座学で気になっていること 1] 品川は昔、宿場町だったと知った。'
    - '[座学で気になっていること 2] 昔の建物と新しいビルが合わさっている様子がお城みたいでワクワクする。'
    - '[座学で気になっていること 3] リアムのお父さんから、昔はもっとごちゃごちゃしていたと聞いた。'
    - '[前提] これは企業協力型の学外教育プログラムです。午前中 (10:00-11:00) に教室で座学を行い、昼食をはさんで、午後 13時から 15時までの 2時間、品川駅前に出てフィールドワークをします。FWではいくつかの企業 (水族館・プリンスホテル・京急・トヨタ・税務署・JR・NTT・ソニー・コクヨ・食肉市場・浄水場・日鉄興和不動産) が学生の受け入れ担当を配置していて、訪れれば自社の取り組みと品川の未来について語ってくれます。フィールドは品川駅周辺。15:00 までに出発地である東西自由通路 (駅の東西を結ぶ歩行者デッキの中央、港南側と高輪側のどちらにも等距離) に戻ります。途中の動きはあなたの判断です。一人で動くか誰かと一緒に動くかも自分で決めて構いません。'
    - '[今日のFW課題] FW中、最低でも 2社以上の企業担当者 (受け入れ拠点) のところを実際に訪ね、自社の取り組みや品川での役割について話を聞いてください。どの企業を選ぶかは自分の興味で決めて構いませんが、必ず 2社以上に立ち寄ること。'
    - '[現在地] 東西自由通路 (駅の東西を結ぶ歩行者デッキの中央)。13時に集合してフィールドワークを始めたばかり。港南側にも高輪側にも等距離で行ける。座学で議論した知識は頭に入っているが、実際に歩いてどんな光景・動線・人の流れに出会うかは現地次第。'
